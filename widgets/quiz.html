<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Before and After Quiz</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="widget.css">
<script src="theme.js"></script>
<style>
  fieldset { border: 0; margin: 0; padding: 14px; background: var(--wash); display: grid; gap: 8px; }
  legend { font-weight: 600; padding: 0; margin-bottom: 6px; float: left; width: 100%; }
  fieldset label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
  fieldset label input { margin-top: 3px; accent-color: var(--band); }
  fieldset label.right { border-color: var(--good); background: var(--good-wash); }
  fieldset label.wrong { border-color: var(--bad); background: var(--bad-wash); }
  .exp { font-size: 15px; color: var(--ink); border-left: 4px solid var(--band); padding: 6px 10px; background: var(--paper); }
</style>
</head>
<body>
<header class="band"><div>
  <p class="kicker"><a href="../index.html">Causal inference for beginners</a> · Quiz</p>
  <h1>Before and After Quiz</h1>
  <p>Twelve questions. Take it before you start and again at the end. Your answers stay on your phone.</p>
</div></header>
<main>
  <section class="panel">
    <div class="seg" id="mode" role="group" aria-label="Which attempt">
      <button type="button" data-m="pre">Before you start</button>
      <button type="button" data-m="post">After you finish</button>
    </div>
  </section>
  <form id="quiz" class="panel"></form>
  <section class="panel">
    <div class="row"><button class="act" type="button" id="submit">Check my answers</button><button class="act ghost" type="button" id="again">Start again</button></div>
    <p class="claim" id="score" hidden aria-live="polite"></p>
  </section>
  <footer>Questions written by the workshop faculty. Nothing is sent anywhere; the "before" score is kept only in this browser.</footer>
</main>
<script>
const Q = [
 {
  "q": "For one man, the causal effect of smoking on TB death is the difference between:",
  "o": [
   "His risk and the average risk of non-smokers",
   "His risk before and after he started smoking",
   "His outcome if he smokes and if he never smokes",
   "TB risk in smokers and non-smokers in his village"
  ],
  "a": 2,
  "e": "A causal effect compares two potential outcomes of the same person under two exposures. Only one is ever observed."
 },
 {
  "q": "Selvam smoked and died of TB. Had he never smoked, he would still have died of TB. For Selvam, smoking:",
  "o": [
   "Made no difference to his death",
   "Caused his death from TB",
   "Protected him from an earlier death",
   "Doubled his risk of dying of TB"
  ],
  "a": 0,
  "e": "Both his potential outcomes are death, so smoking had no effect on him, even though he smoked and died."
 },
 {
  "q": "If all 100 men smoked, 30 would die of TB. If none smoked, 10 would. The causal risk ratio is:",
  "o": [
   "0.20",
   "0.33",
   "2.00",
   "3.00"
  ],
  "a": 3,
  "e": "0.30 / 0.10 = 3.0. The causal risk difference is 0.20."
 },
 {
  "q": "Smokers and non-smokers are exchangeable when:",
  "o": [
   "Both groups contain the same number of men",
   "Swapping exposures would swap their risks",
   "Both groups were sampled from the same town",
   "Smoking was recorded the same way in both"
  ],
  "a": 1,
  "e": "Had the smokers not smoked, their risk would equal the non-smokers' actual risk, and the other way round."
 },
 {
  "q": "Crude RR for smoking and TB death is 2.1. It is 1.0 among drinkers and 1.0 among non-drinkers. Most likely:",
  "o": [
   "Alcohol confounds; smoking has no effect",
   "Alcohol is a mediator of smoking's effect",
   "Smoking's effect differs by alcohol use",
   "The stratified figures are less reliable"
  ],
  "a": 0,
  "e": "The association vanishes within each level of alcohol, so the 2.1 came through the back-door path via alcohol."
 },
 {
  "q": "Why does randomising who smokes give an unbiased risk ratio?",
  "o": [
   "It makes the trial larger than a cohort",
   "It measures smoking more accurately",
   "It removes chance from the comparison",
   "It balances all other causes on average"
  ],
  "a": 3,
  "e": "A coin cannot be influenced by alcohol or anything else, so other causes are spread equally on average. Chance remains."
 },
 {
  "q": "Which of these is a back-door path from smoking to TB death?",
  "o": [
   "Smoking → Undernutrition → TB death",
   "Smoking → Hospital ← TB death",
   "Smoking ← Alcohol → TB death",
   "Smoking → Cough → TB diagnosis"
  ],
  "a": 2,
  "e": "A back-door path starts with an arrow pointing into the exposure."
 },
 {
  "q": "Smoking lowers birth weight, which raises infant deaths. For the total effect of smoking, adjusting for birth weight:",
  "o": [
   "Removes confounding by birth weight",
   "Removes part of the effect you want",
   "Improves precision with no other change",
   "Is required by most journals"
  ],
  "a": 1,
  "e": "Birth weight is a mediator. Adjusting for it blocks part of the causal path."
 },
 {
  "q": "Smoking and TB are unrelated in a town (OR 1.0). Both raise the chance of admission. Among admitted patients the OR is 0.45. This is:",
  "o": [
   "Confounding by age",
   "A true protective effect",
   "Recall bias by patients",
   "Selection on a collider"
  ],
  "a": 3,
  "e": "Admission is a common effect of smoking and TB. Studying only admitted patients opens the path through it (Berkson's bias)."
 },
 {
  "q": "40% of men drink. TB risks: drinkers 0.6 if smokers, 0.3 if not; non-drinkers 0.2 and 0.1. The standardised risk ratio is:",
  "o": [
   "1.5",
   "3.0",
   "2.0",
   "4.0"
  ],
  "a": 2,
  "e": "All smoked: 0.4 × 0.6 + 0.6 × 0.2 = 0.36. None: 0.4 × 0.3 + 0.6 × 0.1 = 0.18. 0.36 / 0.18 = 2.0."
 },
 {
  "q": "For a total effect, which kind of variable should you never adjust for?",
  "o": [
   "One caused by the exposure",
   "One that causes the outcome",
   "A common cause of both",
   "One measured at baseline"
  ],
  "a": 0,
  "e": "Anything downstream of the exposure, such as a mediator, removes part of the effect or opens a collider path."
 },
 {
  "q": "One model, built for cooking fuel, also gives an OR of 1.32 for mother's education. That 1.32 is:",
  "o": [
   "The total effect of mother's education",
   "Not a total effect: fuel is a mediator",
   "Unbiased, because it is adjusted",
   "Smaller than the true effect, always"
  ],
  "a": 1,
  "e": "The model adjusts for fuel and kitchen, which education causes. Reading it as education's effect is the Table 2 fallacy."
 }
];
let mode = 'pre';
const KEY = 'ci-quiz-pre-v2';
const get = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
const set = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
function render() {
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
  document.getElementById('quiz').innerHTML = Q.map((x, i) => `<fieldset id="f${i}"><legend>${i + 1}. ${x.q}</legend>` +
    x.o.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join('') + '</fieldset>').join('');
  document.getElementById('score').hidden = true;
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
document.getElementById('again').onclick = render;
document.getElementById('submit').onclick = () => {
  let s = 0, blank = 0;
  Q.forEach((x, i) => {
    const f = document.getElementById('f' + i), pick = f.querySelector('input:checked');
    if (!pick) blank++;
    f.querySelectorAll('label').forEach((l, j) => { l.classList.toggle('right', j === x.a); l.classList.toggle('wrong', !!pick && +pick.value === j && j !== x.a); });
    if (pick && +pick.value === x.a) s++;
    if (!f.querySelector('.exp')) f.insertAdjacentHTML('beforeend', `<p class="exp">${x.e}</p>`);
  });
  const el = document.getElementById('score'); el.hidden = false;
  let t = `You scored ${s} out of ${Q.length}.` + (blank ? ` ${blank} left blank.` : '');
  if (mode === 'pre') { set(String(s)); el.className = 'claim'; }
  else { const p = get(); el.className = 'claim good'; if (p !== null) t += ` Before you started, you scored ${p}.`; }
  el.textContent = t;
};
render();
</script>
</body>
</html>
